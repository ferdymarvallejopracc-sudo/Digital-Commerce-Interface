    // --- HTML5 Canvas Charts ---
    function CanvasLineChart({ data }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const w = canvas.width = canvas.parentElement.clientWidth || 400;
        const h = canvas.height = 200;

        ctx.clearRect(0, 0, w, h);

        if (!data || data.length === 0) return;

        const maxVal = Math.max(...data.map(d => d.revenue), 100);
        const padding = 30;
        const chartW = w - padding * 2;
        const chartH = h - padding * 2;

        ctx.strokeStyle = "#EEF1F7";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = padding + (chartH / 4) * i;
          ctx.beginPath();
          ctx.moveTo(padding, y);
          ctx.lineTo(w - padding, y);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.strokeStyle = "#02C39A";
        ctx.lineWidth = 3;
        data.forEach((d, i) => {
          const x = padding + (chartW / (data.length - 1 || 1)) * i;
          const y = h - padding - (d.revenue / maxVal) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        ctx.fillStyle = "#02C39A";
        ctx.font = "11px sans-serif";
        data.forEach((d, i) => {
          const x = padding + (chartW / (data.length - 1 || 1)) * i;
          const y = h - padding - (d.revenue / maxVal) * chartH;

          ctx.beginPath();
          ctx.arc(x, y, 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#94A3B8";
          ctx.textAlign = "center";
          ctx.fillText(d.day, x, h - 10);
          ctx.fillStyle = "#02C39A";
        });
      }, [data]);

      return <canvas ref={canvasRef} className="w-full h-[200px]" />;
    }

    function CanvasBarChart({ data }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const w = canvas.width = canvas.parentElement.clientWidth || 400;
        const h = canvas.height = 220;

        ctx.clearRect(0, 0, w, h);

        if (!data || data.length === 0) return;

        const maxVal = Math.max(...data.map(d => d.value), 100);
        const padding = 40;
        const chartW = w - padding * 2;
        const chartH = h - padding * 2;
        const barWidth = Math.min(40, chartW / data.length - 15);

        ctx.strokeStyle = "#EEF1F7";
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = padding + (chartH / 4) * i;
          ctx.beginPath();
          ctx.moveTo(padding, y);
          ctx.lineTo(w - padding, y);
          ctx.stroke();
        }

        data.forEach((d, i) => {
          const barHeight = (d.value / maxVal) * chartH;
          const x = padding + i * (chartW / data.length) + (chartW / data.length - barWidth) / 2;
          const y = h - padding - barHeight;

          ctx.fillStyle = "#1E2761";
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(x, y, barWidth, barHeight, [4, 4, 0, 0]);
          } else {
            ctx.fillRect(x, y, barWidth, barHeight);
          }
          ctx.fill();

          ctx.fillStyle = "#94A3B8";
          ctx.font = "11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(d.name, x + barWidth / 2, h - 15);
        });
      }, [data]);

      return <canvas ref={canvasRef} className="w-full h-[220px]" />;
    }

    const STORAGE_KEY = "dci-app-data-local-v3";

    const NAVY = "#1E2761";

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function currency(n) {
      return "₱" + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function todayKey(d = new Date()) {
      return d.toISOString().slice(0, 10);
    }

    async function toHex(bytes) {
      return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function hashPassword(password, saltHex) {
      const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      let hexString = "";
      if (typeof saltHex === "string") {
        hexString = saltHex;
      } else if (saltHex && typeof saltHex === "object") {
        hexString = await toHex(new Uint8Array(Object.values(saltHex)));
      }
      const matches = hexString.match(/.{2}/g) || [];
      const salt = Uint8Array.from(matches.map((h) => parseInt(h, 16)));
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, key, 256);
      return toHex(new Uint8Array(bits));
    }

    async function makeAuth(password) {
      const salt = await toHex(crypto.getRandomValues(new Uint8Array(16)));
      return { salt, hash: await hashPassword(password, salt) };
    }

    async function checkPassword(password, auth) {
      return (await hashPassword(password, auth.salt)) === auth.hash;
    }

    function passwordError(pw) {
      return pw.length < 6 ? "Password must be at least 6 characters." : "";
    }

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState("dashboard");
      const [saveState, setSaveState] = useState("idle");
      const [authed, setAuthed] = useState(false);

      useEffect(() => {
        try {
          const res = localStorage.getItem(STORAGE_KEY);
          if (res) {
            setData({ ...defaultData, ...JSON.parse(res) });
          } else {
            setData(defaultData);
          }
        } catch (e) {
          setData(defaultData);
        }
        setLoading(false);
      }, []);

      async function persist(next) {
        setData(next);
        setSaveState("saving");
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          setSaveState("saved");
        } catch (e) {
          setSaveState("error");
        }
        setTimeout(() => setSaveState("idle"), 1200);
      }

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-white">
            <div className="text-slate-400 text-sm">Loading Digital Commerce Interface…</div>
          </div>
        );
      }

      if (!data.profile) {
        return (
          <SetupScreen
            onComplete={async (profile, password) => {
              const auth = await makeAuth(password);
              await persist({ ...data, profile, auth });
              setAuthed(true);
            }}
          />
        );
      }
      if (!authed) {
        return (
          <LoginScreen
            data={data}
            onSuccess={() => setAuthed(true)}
            onCreate={async (password) => {
              const auth = await makeAuth(password);
              await persist({ ...data, auth });
              setAuthed(true);
            }}
          />
        );
      }

      const navItems = [
        { key: "dashboard", label: "Dashboard", icon: LayoutDashboard, always: true },
        { key: "inventory", label: "Inventory", icon: Package, module: "inventory" },
        { key: "sales", label: "Sales", icon: ShoppingCart, module: "sales" },
        { key: "reports", label: "Reports", icon: BarChart3, module: "reports" },
        { key: "settings", label: "Settings", icon: Settings, always: true },
      ].filter((n) => n.always || data.modules[n.module]);

      return (
        <div className="min-h-screen bg-slate-50 flex text-slate-800" style={{ fontFamily: "Calibri, Arial, sans-serif" }}>
          {/* Sidebar */}
          <div className="w-60 shrink-0 flex flex-col" style={{ background: NAVY }}>
            <div className="px-5 py-6 border-b border-white/10">
              <div className="flex items-center gap-2">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: MINT }}>
                  <Store size={18} color={NAVY} />
                </div>
                <div>
                  <div className="text-white font-bold text-sm leading-tight">Digital Commerce</div>
                  <div className="text-white/50 text-xs leading-tight">Interface</div>
                </div>
              </div>
            </div>
            <nav className="flex-1 px-3 py-4 space-y-1">
              {navItems.map((n) => {
                const Icon = n.icon;
                const active = view === n.key;
                return (
                  <button
                    key={n.key}
                    onClick={() => setView(n.key)}
                    className={
                      "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors " +
                      (active ? "bg-white/10 text-white" : "text-white/60 hover:bg-white/5 hover:text-white")
                    }
                  >
                    <Icon size={17} />
                    {n.label}
                  </button>
                );
              })}
            </nav>
            <div className="px-5 py-4 border-t border-white/10">
              <div className="text-white text-sm font-semibold truncate">{data.profile.businessName}</div>
              <div className="text-white/50 text-xs truncate">{data.profile.ownerName}</div>
              <button
                onClick={() => { setAuthed(false); setView("dashboard"); }}
                className="mt-3 flex items-center gap-2 text-xs text-white/60 hover:text-white"
              >
                <LogOut size={14} /> Log out
              </button>
            </div>
          </div>

          {/* Main Content */}
          <div className="flex-1 flex flex-col min-w-0">
            <div className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0">
              <div className="text-sm text-slate-400 flex items-center gap-1.5">
                <span>Digital Commerce Interface</span>
                <ChevronRight size={14} />
                <span className="text-slate-700 font-medium capitalize">{view}</span>
              </div>
              <div className="text-xs text-slate-400">
                {saveState === "saving" && "Saving…"}
                {saveState === "saved" && "Saved"}
                {saveState === "error" && "Save failed"}
              </div>
            </div>
            <div className="flex-1 overflow-auto p-6">
              {view === "dashboard" && <Dashboard data={data} />}
              {view === "inventory" && data.modules.inventory && (
                <Inventory data={data} persist={persist} />

              {view === "sales" && data.modules.sales && (

              {view === "reports" && data.modules.reports && <Reports data={data} />}
              {view === "settings" && <SettingsView data={data} persist={persist} />}
            </div>
          </div>
        </div>
      );

    function SetupScreen({ onComplete }) {
      const [businessName, setBusinessName] = useState("");
      const [ownerName, setOwnerName] = useState("");
      const [businessType, setBusinessType] = useState("Retail");
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      async function submit() {
        const bn = businessName.trim();
        const on = ownerName.trim();
        if (!bn || !on) return setError("Business name and owner name are required.");
        const err = passwordError(password);
        if (err) return setError(err);
        if (password !== confirm) return setError("Passwords do not match.");
        setError("");
        setBusy(true);
        await onComplete({ businessName: bn, ownerName: on, businessType, createdAt: new Date().toISOString() }, password);
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-6" style={{ background: NAVY }}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

                <Store size={20} color={NAVY} />

              <div className="text-lg font-bold text-slate-800">Digital Commerce Interface</div>
            </div>
            <p className="text-sm text-slate-500 mb-6">Let's set up your business profile to get started — free, no payment required.</p>

            <div className="space-y-4">
              <div>
                <label className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Business Name</label>
                <input
                  className="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2"
                  value={businessName}
                  onChange={(e) => setBusinessName(e.target.value)}

              </div>
              <div>

    function LoginScreen({ data, onSuccess, onCreate }) {
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [error, setError] = useState("");
      const [attempts, setAttempts] = useState(0);
      const [lockedUntil, setLockedUntil] = useState(0);
      const [busy, setBusy] = useState(false);
      const needsPassword = !data.auth;

      async function submit() {
        setError("");
        if (needsPassword) {
          const err = passwordError(password);
          if (err) return setError(err);
          if (password !== confirm) return setError("Passwords do not match.");
          setBusy(true);
          await onCreate(password);
          return;
        }
        if (Date.now() < lockedUntil) return setError("Too many attempts. Please wait a few seconds and try again.");
        setBusy(true);
        const ok = await checkPassword(password, data.auth);
        setBusy(false);
        if (ok) return onSuccess();
        const n = attempts + 1;
        setPassword("");
        if (n >= 5) {
          setAttempts(0);
          setLockedUntil(Date.now() + 30000);
          setError("Too many failed attempts. Locked for 30 seconds.");
        } else {
          setAttempts(n);
          setError("Incorrect password.");
        }
      }

      const cls = "mt-3 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none";
      return (
        <div className="min-h-screen flex items-center justify-center p-6" style={{ background: NAVY }}>
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8">
            <div className="flex items-center gap-2 mb-1">
              <div className="w-10 h-10 rounded-lg flex items-center justify-center" style={{ background: MINT }}>
                <Lock size={20} color={NAVY} />
              </div>
              <div className="text-lg font-bold text-slate-800 truncate">{data.profile.businessName}</div>
            </div>
            <p className="text-sm text-slate-500 mt-1">
              {needsPassword ? "Create an owner password to protect your business records." : "Enter your owner password to continue."}
            </p>
            <input
              type="password"
              className={cls}
              placeholder={needsPassword ? "Create a password (min. 6 characters)" : "Password"}
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && !needsPassword && submit()}
            />
            {needsPassword && (
              <input
                type="password"
                className={cls}
                placeholder="Confirm password"
                value={confirm}
                onChange={(e) => setConfirm(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submit()}
              />
            )}
            {error && <div className="mt-3 text-xs text-red-600">{error}</div>}
            <button
              disabled={busy || !password}
              onClick={submit}
              className="mt-5 w-full py-2.5 rounded-lg text-white font-semibold text-sm disabled:opacity-40"
              style={{ background: NAVY }}
            >
              {needsPassword ? "Set Password" : "Log In"}
            </button>
          </div>
        </div>
      );
    }

    function Sales({ data, persist }) {
      const [cart, setCart] = useState([]);

      const [qty, setQty] = useState(1);
      const [msg, setMsg] = useState("");

      const availableProducts = data.products.filter((p) => p.quantity > 0);

      function addToCart() {
        const product = data.products.find((p) => p.id === selectedProduct);
        if (!product) return setMsg("Select a product first.");
        if (!Number.isInteger(Number(qty)) || Number(qty) < 1) return setMsg("Quantity must be a whole number of 1 or more.");
        const existing = cart.find((c) => c.productId === product.id);
        const cartQty = (existing?.qty || 0) + Number(qty);
        if (cartQty > product.quantity) {
          setMsg(`Only ${product.quantity} in stock for ${product.name}.`);
          return;
        }
        if (existing) {
          setCart(cart.map((c) => (c.productId === product.id ? { ...c, qty: cartQty } : c)));
        } else {
          setCart([...cart, { productId: product.id, name: product.name, price: product.price, qty: Number(qty) }]);
        }
        setSelectedProduct("");
        setQty(1);
        setMsg("");
      }

      function removeFromCart(productId) {
        setCart(cart.filter((c) => c.productId !== productId));
      }

      const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

      function completeSale() {
        if (cart.length === 0) return;
        const products = data.products.map((p) => {
          const item = cart.find((c) => c.productId === p.id);
          return item ? { ...p, quantity: p.quantity - item.qty } : p;
        });
        const sale = { id: uid(), date: new Date().toISOString(), items: cart, total };
        persist({ ...data, products, sales: [...data.sales, sale] });
        setCart([]);

    function Reports({ data }) {
      const { sales, products } = data;
      const totalRevenue = sales.reduce((s, x) => s + x.total, 0);
      const totalUnitsSold = sales.reduce((sum, s) => sum + s.items.reduce((is, i) => is + i.qty, 0), 0);

      const categoryData = useMemo(() => {
        const map = {};
        products.forEach((p) => {
          const cat = p.category || "Uncategorized";
          map[cat] = 0;
        });
        sales.forEach((s) => {
          s.items.forEach((item) => {
            const p = products.find((prod) => prod.id === item.productId);
            const cat = p?.category || "Uncategorized";
            map[cat] = (map[cat] || 0) + item.price * item.qty;
          });
        });
        return Object.keys(map).map((k) => ({ name: k, value: map[k] }));
      }, [sales, products]);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 gap-4">
            <StatCard icon={TrendingUp} label="Total Sales Revenue" value={currency(totalRevenue)} color={NAVY} />
            <StatCard icon={Boxes} label="Total Units Sold" value={totalUnitsSold} color={MINT} />
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5">
            <div className="font-semibold text-sm text-slate-700 mb-4">Revenue by Category</div>
            {categoryData.length === 0 ? (
              <div className="text-sm text-slate-400">No data available yet.</div>
            ) : (
              <CanvasBarChart data={categoryData} />
            )}
          </div>
        </div>
      );
    }

    function SettingsView({ data, persist }) {
      const [modules, setModules] = useState(data.modules);
      const [pwModal, setPwModal] = useState(false);
      const [oldPassword, setOldPassword] = useState("");
      const [newPassword, setNewPassword] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [pwError, setPwError] = useState("");
      const [pwSuccess, setPwSuccess] = useState("");

      function toggleModule(m) {
        const next = { ...modules, [m]: !modules[m] };
        setModules(next);
        persist({ ...data, modules: next });
      }

      async function updatePassword() {
        setPwError("");
        setPwSuccess("");
        if (data.auth) {
          const valid = await checkPassword(oldPassword, data.auth);
          if (!valid) return setPwError("Incorrect current password.");
        }
        const err = passwordError(newPassword);
        if (err) return setPwError(err);
        if (newPassword !== confirmPassword) return setPwError("New passwords do not match.");

        const auth = await makeAuth(newPassword);
        persist({ ...data, auth });
        setPwSuccess("Password updated successfully.");
        setOldPassword("");
        setNewPassword("");
        setConfirmPassword("");
      }

      return (
        <div className="space-y-6 max-w-xl">
          <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
            <div className="font-semibold text-sm text-slate-700">Business Profile</div>
            <div className="grid grid-cols-2 gap-3 text-sm">
              <div>
                <span className="text-xs text-slate-400 block">Business Name</span>
                <span className="font-medium text-slate-700">{data.profile.businessName}</span>
              </div>
              <div>
                <span className="text-xs text-slate-400 block">Owner Name</span>
                <span className="font-medium text-slate-700">{data.profile.ownerName}</span>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
            <div className="font-semibold text-sm text-slate-700">Modules</div>
            <div className="space-y-3">
              {Object.keys(modules).map((m) => (
                <div key={m} className="flex items-center justify-between text-sm capitalize">
                  <span className="text-slate-700">{m}</span>
                  <button onClick={() => toggleModule(m)} className="text-slate-600 font-medium">
                    {modules[m] ? <ToggleRight size={24} color={MINT} /> : <ToggleLeft size={24} color="#CBD5E1" />}
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
            <div className="font-semibold text-sm text-slate-700">Security</div>
            <button
              onClick={() => setPwModal(true)}
              className="px-4 py-2 rounded-lg text-sm font-semibold border border-slate-200 text-slate-700 hover:bg-slate-50"
            >
              Change Owner Password
            </button>
          </div>

          {pwModal && (
            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-6">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 space-y-3">
                <div className="flex items-center justify-between mb-2">
                  <div className="font-bold text-slate-800">Change Password</div>
                  <button onClick={() => setPwModal(false)} className="text-slate-400 hover:text-slate-700"><X size={18} /></button>
                </div>
                {data.auth && (
                  <input
                    type="password"
                    className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"
                    placeholder="Current password"
                    value={oldPassword}
                    onChange={(e) => setOldPassword(e.target.value)}
                  />
                )}
                <input
                  type="password"
                  className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"
                  placeholder="New password (min. 6 chars)"
                  value={newPassword}
                  onChange={(e) => setNewPassword(e.target.value)}
                />
                <input
                  type="password"
                  className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"
                  placeholder="Confirm new password"
                  value={confirmPassword}
                  onChange={(e) => setConfirmPassword(e.target.value)}
                />
                {pwError && <div className="text-xs text-red-600">{pwError}</div>}
                {pwSuccess && <div className="text-xs text-emerald-600">{pwSuccess}</div>}
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setPwModal(false)} className="px-3 py-1.5 text-sm text-slate-500">Close</button>
                  <button
                    onClick={updatePassword}
                    className="px-4 py-1.5 rounded-lg text-sm font-semibold text-white"
                    style={{ background: NAVY }}
                  >
                    Update
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
